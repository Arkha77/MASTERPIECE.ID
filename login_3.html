    color:var(--cream);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:56px 64px;
    overflow:hidden;
  }

  .brand-panel::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(185deg, rgba(10,61,10,0.88) 0%, rgba(11,110,9,0.55) 45%, rgba(10,61,10,0.9) 100%);
    z-index:0;
  }

  .brand-mark{
    display:flex;
    align-items:center;
    z-index:2;
    width:fit-content;
  }

  .brand-logo-img{
    height:34px;
    width:auto;
    display:block;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.35));
  }

  .brand-footer{
    z-index:2;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    font-size:13px;
    color:rgba(250,248,243,0.6);
  }

  .brand-footer .tagline{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:15px;
    color:rgba(250,248,243,0.85);
  }

  /* ---------- Leaf motif (subtle, single moment of motion) ---------- */
  .leaf-field{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
  }

  .leaf{
    position:absolute;
    opacity:0;
    transform-origin:center;
    animation: driftIn 1.8s ease-out forwards, sway 8s ease-in-out infinite;
  }

  @keyframes driftIn{
    from{ opacity:0; transform:translateY(14px) rotate(var(--rot,0deg)) scale(0.9); }
    to{ opacity:var(--op,0.5); transform:translateY(0) rotate(var(--rot,0deg)) scale(1); }
  }

  @keyframes sway{
    0%,100%{ transform:translateY(0) rotate(var(--rot,0deg)); }
    50%{ transform:translateY(-8px) rotate(calc(var(--rot,0deg) + 4deg)); }
  }

  @media (prefers-reduced-motion: reduce){
    .leaf{ animation:none; opacity:var(--op,0.5); }
  }

  /* ---------- Right: form panel ---------- */
  .form-panel{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    padding:40px;
  }

  .form-wrap{
    width:100%;
    max-width:360px;
  }

  .form-wrap .eyebrow{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 6px 0;
  }

  .form-wrap h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:28px;
    margin:0 0 34px 0;
    color:var(--ink);
  }

  .field{
    margin-bottom:20px;
  }

  .field label{
    display:block;
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:7px;
  }

  .field input{
    width:100%;
    padding:12px 14px;
    font-size:15px;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:6px;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }

  .field input::placeholder{ color:#9a9d92; }

  .field input:focus{
    border-color:var(--forest);
    background:var(--paper);
  }

  .field input:focus-visible{
    box-shadow: 0 0 0 3px rgba(11,110,9,0.15);
  }

  .password-row{
    position:relative;
  }

  .toggle-pw{
    position:absolute;
    right:12px;
    top:38px;
    background:none;
    border:none;
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }

  .toggle-pw:hover{ color:var(--forest); }

  .row-between{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:-6px 0 26px 0;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    color:var(--ink-soft);
  }

  .remember input{
    accent-color:var(--forest);
    width:14px; height:14px;
  }

  .forgot{
    font-size:13.5px;
    color:var(--forest);
    text-decoration:none;
  }

  .forgot:hover{ text-decoration:underline; }

  .btn-signin{
    width:100%;
    padding:13px;
    font-size:15px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    color:var(--cream);
    background:var(--forest);
    border:none;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, transform .05s ease, opacity .15s ease;
  }

  .btn-signin:disabled{
    opacity:0.6;
    cursor:not-allowed;
  }

  .form-message{
    font-size:13.5px;
    padding:10px 12px;
    border-radius:6px;
    margin:0 0 16px 0;
  }

  .form-message.error{
    background:#fbeae6;
    color:var(--error);
  }

  .form-message.success{
    background:#e7f3e6;
    color:var(--forest-deep);
  }

  .btn-signin:hover{ background:var(--forest-deep); }
  .btn-signin:active{ transform:translateY(1px); }
  .btn-signin:focus-visible{ box-shadow:0 0 0 3px rgba(11,110,9,0.25); }

  .helper-text{
    margin-top:22px;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.6;
  }

  .helper-text a{
    color:var(--forest);
    text-decoration:none;
  }

  .helper-text a:hover{ text-decoration:underline; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px){
    body{ grid-template-columns:1fr; }
    .brand-panel{
      padding:36px 28px;
      min-height:280px;
    }
    .brand-copy h1{ font-size:30px; }
    .brand-footer{ flex-direction:column; align-items:flex-start; gap:6px; }
    .form-panel{ padding:32px 24px 56px; }
  }
</style>
</head>

  <section class="form-panel">
    <div class="form-wrap">
      <p class="eyebrow">Finance</p>
      <h2>Masuk ke akun kamu</h2>

      <form id="loginForm">
        <div class="field">
          <label for="loginId">Login ID</label>
          <input type="text" id="loginId" name="loginId" placeholder="Masukkan login ID" autocomplete="username" required>
        </div>

        <div class="field password-row">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw">Lihat</button>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" name="remember">
            Ingat saya
          </label>
          <a href="#" class="forgot">Lupa password?</a>
        </div>

        <p id="formMessage" class="form-message" style="display:none;"></p>

        <button type="submit" class="btn-signin" id="submitBtn">Masuk</button>
      </form>

      <p class="helper-text">Butuh akses? Hubungi admin sistem di<br><a href="mailto:masterpiece.id77@gmail.com">masterpiece.id77@gmail.com</a></p>
      <p id="cpLogin" style="position:fixed;right:16px;bottom:10px;margin:0;font-size:11px;opacity:.7;color:#5b6156;pointer-events:none">&copy; <span id="cpYear">2026</span> PT. Masterpiece Indonesia. Hak cipta dilindungi.</p>
    </div>
  </section>

<script>
  document.getElementById('cpYear').textContent = new Date().getFullYear();
  const toggle = document.getElementById('togglePw');
  const pw = document.getElementById('password');
  toggle.addEventListener('click', () => {
    const isPw = pw.type === 'password';
    pw.type = isPw ? 'text' : 'password';
    toggle.textContent = isPw ? 'Sembunyikan' : 'Lihat';
  });

  // ============ KONEKSI KE BACKEND (Google Apps Script) ============
  const API_URL = 'https://script.google.com/macros/s/AKfycbxC10AFdd0hg9KEme_5Y8Ec3k8jab1kk-AcCzimRaxwvg3tq9tybxYFqarSuGtv4Rcq/exec';

  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const formMessage = document.getElementById('formMessage');
  const rememberBox = document.querySelector('input[name="remember"]');

  function showMessage(text, type) {
    formMessage.textContent = text;
    formMessage.className = 'form-message ' + type;
    formMessage.style.display = 'block';
  }

  function hideMessage() {
    formMessage.style.display = 'none';
  }

  // Kalau sebelumnya sudah pernah login & centang "Ingat saya", langsung redirect
  const savedUser = localStorage.getItem('mp_finance_user');
  if (savedUser) {
    // Nanti diarahkan ke dashboard.html begitu halaman itu sudah dibuat
    // window.location.href = 'dashboard.html';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    hideMessage();

    const loginId = document.getElementById('loginId').value.trim();
    const password = document.getElementById('password').value;

    if (!loginId || !password) {
      showMessage('Login ID dan password wajib diisi.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Memeriksa...';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', loginId, password })
      });

      const data = await res.json();

      if (data.success) {
        showMessage('Berhasil masuk! Mengarahkan...', 'success');

        const storage = rememberBox.checked ? localStorage : sessionStorage;
        storage.setItem('mp_finance_user', JSON.stringify(data.user));

        setTimeout(function () {
          window.location.href = 'dashboard.html';
        }, 700);
      } else {
        showMessage(data.message || 'Login gagal. Coba lagi.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
      }
    } catch (err) {
      showMessage('Tidak bisa terhubung ke server. Cek koneksi internet kamu.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Masuk';
    }
  });
</script>
