<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAB Builder — Masterpiece.id</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mp-shell.css">
<script src="mp-shell.js"></script>
<script src="mp-docs.js"></script>
<style>
  .dp .dp-table.rab th,.dp .dp-table.rab td{ width:auto; }
  .dp .dp-table.rab .grp td{ background:#f3f1ea; font:700 9.5px Inter,Arial,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:#5b6156; padding:6px 8px; }
  .dp-sig2{ display:flex; justify-content:space-between; gap:20px; margin-top:34px; break-inside:avoid; page-break-inside:avoid; }
  .guide{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .guide ul{ margin:8px 0 0; padding-left:18px; }
  .guide b{ color:var(--ink); }
</style>
</head>
<body>
<main class="mp-main"><div class="mp-wrap" style="max-width:1280px">
  <div id="tabsHost"></div>
  <div class="md-bar">
    <div class="grp"><span class="md-chip" id="stChip">Draft</span></div>
    <div class="grp">
      <button type="button" class="mp-btn sm" id="btnInv"></button>
      <button type="button" class="mp-btn" id="btnSign"></button>
      <button type="button" class="mp-btn" id="btnSave"></button>
      <button type="button" class="mp-btn dark" id="btnPrint"></button>
    </div>
  </div>
  <div class="md-layout">
    <div class="md-form" id="form"></div>
    <div class="md-prev">
      <div class="md-zoom"><button type="button" id="zMin" aria-label="Perkecil">−</button><span id="zLbl">100%</span><button type="button" id="zPlus" aria-label="Perbesar">+</button></div>
      <div class="md-stage" id="stage"><div class="md-sizer" id="sizer"><div class="dp" id="docPaper"></div></div></div>
    </div>
  </div>
</div></main>

<script>
MP.ready(async function () {
  var $ = MP.$, esc = MP.esc, S = {}, klien = [], proyek = [], docs = [];
  var dirty = false, saved = false, zoom;
  var user = MP.user;

  $('#tabsHost').innerHTML = MPD.tabs('rab');
  $('#btnInv').innerHTML = MP.icon('transaksi') + ' Jadikan invoice';
  $('#btnSign').innerHTML = MP.icon('edit') + ' Tanda tangan';
  $('#btnSave').innerHTML = MP.icon('check') + ' Simpan';
  $('#btnPrint').innerHTML = MP.icon('print') + ' Ekspor PDF';

  function newItem() { return { nama: '', ket: '', qty: '', satuan: 'm²', harga: 0 }; }
  function newExtra() { return { nama: '', ket: '', qty: '1', satuan: 'Ls', harga: 0 }; }
  var D = {
    idDokumen: '', nomor: '', tanggal: MP.today(), judul: '',
    klienKode: '', klienNama: '', proyekKode: '', proyekNama: '', proyekText: '',
    items: [newItem()], extra: [],
    show: { pt: false, ttd: true, stempel: false, klienTtd: true }, sig: '', sigKlien: '', catatan: ''
  };

  function dec(v) { var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : 0; }
  function line(it) { return Math.max(0, dec(it.qty) * MP.num(it.harga)); }
  function sum(list) { return list.reduce(function (s, it) { return s + line(it); }, 0); }
  function total() { return sum(D.items) + sum(D.extra); }
  function filled(it) { return it.nama.trim() || MP.num(it.harga); }

  function markDirty() { dirty = true; setChip(); }
  function setChip() {
    var c = $('#stChip');
    if (!saved) { c.textContent = 'Draft'; c.className = 'md-chip'; }
    else if (dirty) { c.textContent = 'Belum disimpan'; c.className = 'md-chip warn'; }
    else { c.textContent = 'Tersimpan'; c.className = 'md-chip ok'; }
  }
  function klienRec() { return klien.filter(function (k) { return String(k.kodeKlien).toUpperCase() === String(D.klienKode).toUpperCase(); })[0]; }

  /* ---------- kertas ---------- */
  function rowsHTML(list) {
    return list.filter(filled).map(function (it) {
      return '<tr><td>' + esc(it.nama || '—') + (it.ket ? '<div class="sub">' + esc(it.ket) + '</div>' : '') + '</td><td class="n">' + esc(String(dec(it.qty) || 0).replace('.', ',')) + '</td><td>' + esc(it.satuan) + '</td><td class="n">' + MP.rupiah(MP.num(it.harga)) + '</td><td class="n">' + MP.rupiah(line(it)) + '</td></tr>';
    }).join('');
  }
  function renderPaper() {
    var k = klienRec() || {};
    var to = '<b>' + esc(D.klienNama || '—') + '</b>' + (k.perusahaan ? '\n' + esc(k.perusahaan) : '') + (k.alamat ? '\n' + esc(k.alamat) : '');
    var a = rowsHTML(D.items), b = rowsHTML(D.extra);
    var body = (a ? '<tr class="grp"><td colspan="5">Pekerjaan</td></tr>' + a : '') + (b ? '<tr class="grp"><td colspan="5">Item tambahan</td></tr>' + b : '');
    if (!body) body = '<tr><td colspan="5" style="color:#8a8f84;text-align:center;padding:18px">Belum ada item</td></tr>';
    var signer = S.penandatangan || user.nama || '', jab = S.jabatan || '';
    var left = D.show.ttd || D.show.stempel ? MPD.signBlock({ label: 'Dibuat oleh', nama: signer, jabatan: jab || 'Dibuat oleh', kota: S.kota, tanggal: D.tanggal, img: D.show.ttd ? D.sig : '', stamp: D.show.stempel, s: S }) : '<div></div>';
    var right = D.show.klienTtd ? MPD.signBlock({ nama: D.klienNama || 'Klien', jabatan: 'Disetujui klien', img: D.sigKlien, s: S }) : '<div></div>';
    var foot = [S.namaPerusahaan, S.tagline].filter(Boolean).join(' · ');
    $('#docPaper').innerHTML =
      '<div class="dp-head">' + MPD.letterhead(S, D.show.pt) +
      '<div><div class="dp-title" style="font-size:22px">RENCANA ANGGARAN BIAYA</div><table class="dp-meta"><tr><td>No.</td><td>' + esc(D.nomor || $('#fNomor').value || '—') + '</td></tr><tr><td>Tanggal</td><td>' + esc(MPD.tglPanjang(D.tanggal)) + '</td></tr></table></div></div>' +
      '<div class="dp-sec">Untuk</div><div class="dp-to">' + to + '</div>' +
      (D.judul || D.proyekText ? '<div class="dp-sec" style="margin-top:16px">Pekerjaan</div><div class="dp-to">' + (D.judul ? '<b>' + esc(D.judul) + '</b>' : '') + (D.judul && D.proyekText ? '\n' : '') + esc(D.proyekText) + '</div>' : '') +
      '<table class="dp-table rab"><colgroup><col><col style="width:62px"><col style="width:58px"><col style="width:110px"><col style="width:116px"></colgroup><thead><tr><th>Rincian pekerjaan</th><th class="n">Luas/Qty</th><th>Satuan</th><th class="n">Harga</th><th class="n">Jumlah</th></tr></thead><tbody>' + body + '</tbody></table>' +
      '<div class="dp-tot"><div class="g"><span>Total RAB</span><span>' + MP.rupiah(total()) + '</span></div></div>' +
      (D.catatan ? '<div class="dp-note"><b>Catatan</b>\n' + esc(D.catatan) + '</div>' : '') +
      '<div class="dp-sig2">' + left + right + '</div>' +
      '<div class="dp-foot">' + esc(foot) + '</div>';
    if (zoom) zoom.refresh();
  }

  /* ---------- form ---------- */
  function card(it, i, g) {
    var isM = g === 'items';
    return '<div class="md-item" data-i="' + i + '" data-g="' + g + '"><div class="top"><span>' + (isM ? 'Pekerjaan ' : 'Tambahan ') + (i + 1) + '</span>' + ((isM ? D.items.length > 1 : true) ? '<button type="button" data-rm aria-label="Hapus">' + MP.icon('trash') + '</button>' : '') + '</div>' +
      '<input class="mp-input" data-f="nama" placeholder="' + (isM ? 'Contoh: Lemari kamar utama' : 'Contoh: Aksesoris / jasa tambahan') + '" value="' + esc(it.nama) + '">' +
      '<input class="mp-input" data-f="ket" placeholder="Spesifikasi / keterangan (opsional)" value="' + esc(it.ket) + '" style="margin-top:8px">' +
      '<div class="row2"><div><label class="mp-label">' + (isM ? 'Luas (m²)' : 'Qty') + '</label><input class="mp-input" data-f="qty" inputmode="decimal" value="' + esc(it.qty) + '"></div>' +
      '<div><label class="mp-label">Satuan</label>' + (isM ? '<input class="mp-input" value="m²" readonly>' : '<select class="mp-select" data-f="satuan">' + MPD.unitOptions(it.satuan) + '</select>') + '</div></div>' +
      '<div class="mp-field" style="margin:8px 0 0"><label class="mp-label">' + (isM ? 'Harga per m²' : 'Harga satuan') + '</label><div class="mp-money"><span>Rp</span><input class="mp-input" data-f="harga" placeholder="0"></div></div>' +
      '<div class="sum"><span>Jumlah</span><b data-sum>' + MP.rupiah(line(it)) + '</b></div></div>';
  }
  function renderLists() {
    ['items', 'extra'].forEach(function (g) {
      var box = $('#' + g + 'Box');
      box.innerHTML = D[g].map(function (it, i) { return card(it, i, g); }).join('');
      MP.$$('[data-f="harga"]', box).forEach(function (el, i) { MP.moneyInput(el); MP.setMoney(el, MP.num(D[g][i].harga)); });
    });
  }
  function buildForm() {
    $('#form').innerHTML =
      '<div class="md-card"><h3>Detail RAB</h3>' +
      '<div class="mp-field"><label class="mp-label">Nomor</label><input class="mp-input" id="fNomor" readonly><p class="mp-hint" id="nomorHint">Diberikan saat disimpan.</p></div>' +
      '<div class="mp-field"><label class="mp-label">Tanggal</label><input class="mp-input" type="date" id="fTgl"></div>' +
      '<div class="mp-field"><label class="mp-label">Klien</label><select class="mp-select" id="fKlien"></select><input class="mp-input" id="fKlienManual" placeholder="Nama klien" style="display:none;margin-top:8px"></div>' +
      '<div class="mp-field"><label class="mp-label">Proyek terkait</label><select class="mp-select" id="fProyekPick"></select></div>' +
      '<div class="mp-field"><label class="mp-label">Judul pekerjaan</label><input class="mp-input" id="fJudul" placeholder="Interior Rumah Bpk. Fajri"></div></div>' +
      '<div class="md-card"><h3>Item pekerjaan (per m²)</h3><div id="itemsBox"></div><button type="button" class="mp-btn block" id="addItem" style="padding:10px;font-size:13px">' + MP.icon('plus') + ' Tambah pekerjaan</button></div>' +
      '<div class="md-card"><h3>Item tambahan</h3><p class="mp-hint" style="margin:-4px 0 10px">Biaya di luar per-m²: aksesoris, jasa, dll.</p><div id="extraBox"></div><button type="button" class="mp-btn block" id="addExtra" style="padding:10px;font-size:13px">' + MP.icon('plus') + ' Tambah item tambahan</button></div>' +
      '<div class="md-card"><h3>Tampilkan</h3>' +
      MPD.toggle('tPt', 'Nama PT', 'Pakai nama badan usaha (Pengaturan) di kop dan footer.', D.show.pt) +
      MPD.toggle('tTtd', 'Tanda tangan perusahaan', 'Blok “Dibuat oleh”.', D.show.ttd) +
      MPD.toggle('tStempel', 'Stempel', 'Stempel bulat perusahaan.', D.show.stempel) +
      MPD.toggle('tKlien', 'Persetujuan klien', 'Blok “Disetujui klien” — bisa ditandatangani langsung.', D.show.klienTtd) + '</div>' +
      '<div class="md-card"><h3>Catatan</h3><textarea class="mp-textarea" id="fCatatan" rows="3" placeholder="Masa pengerjaan, termin pembayaran, dll."></textarea></div>' +
      '<div class="md-card"><h3>Panduan harga</h3><div class="guide">Referensi manual — tidak dihitung otomatis.<ul>' +
      '<li>Standar interior: modal Rp 1.600.000/m² + margin 75% = <b>Rp 2.800.000/m²</b></li>' +
      '<li>Pintu kaca: +Rp 320.000/m²</li><li>Frame aluminium: +Rp 100.000/m²</li><li>Edging aluminium: +Rp 100.000/m²</li><li>Tacosheet: +Rp 260.000/m²</li></ul></div></div>';
    $('#fKlien').innerHTML = '<option value="">— pilih klien —</option>' + klien.slice().sort(function (a, b) { return String(a.namaKlien).localeCompare(String(b.namaKlien)); }).map(function (k) {
      return '<option value="' + esc(k.kodeKlien) + '">' + esc(k.kodeKlien + ' — ' + k.namaKlien) + '</option>'; }).join('') + '<option value="__manual">Ketik manual…</option>';
    fillProyek(); syncForm(); renderLists(); bind();
  }
  function fillProyek() {
    var list = proyek.filter(MP.canSeeProject).filter(function (p) { return !D.klienKode || String(p.klienKode || '').toUpperCase() === D.klienKode.toUpperCase() || !p.klienKode; });
    $('#fProyekPick').innerHTML = '<option value="">— tanpa proyek —</option>' + list.map(function (p) { return '<option value="' + esc(p.idProyek) + '">' + esc(MP.projectLabel(p)) + '</option>'; }).join('');
    var cur = proyek.filter(function (p) { return D.proyekKode && p.kodeProyek === D.proyekKode; })[0];
    if (cur) $('#fProyekPick').value = cur.idProyek;
  }
  function syncForm() {
    $('#fNomor').value = D.nomor || MPD.nextNumber(S.prefixRab || 'RAB', 'rab', docs, D.tanggal);
    $('#nomorHint').textContent = D.idDokumen ? 'Nomor tetap.' : 'Diberikan saat disimpan.';
    $('#fTgl').value = D.tanggal; $('#fJudul').value = D.judul; $('#fCatatan').value = D.catatan;
    var kk = D.klienKode && klien.some(function (k) { return String(k.kodeKlien).toUpperCase() === D.klienKode.toUpperCase(); });
    $('#fKlien').value = kk ? D.klienKode : (D.klienNama ? '__manual' : '');
    $('#fKlienManual').style.display = $('#fKlien').value === '__manual' ? '' : 'none'; $('#fKlienManual').value = kk ? '' : D.klienNama;
  }
  function bind() {
    $('#fTgl').addEventListener('change', function () {
      D.tanggal = this.value || MP.today();
      if (!D.idDokumen) $('#fNomor').value = MPD.nextNumber(S.prefixRab || 'RAB', 'rab', docs, D.tanggal);
      markDirty(); renderPaper();
    });
    $('#fJudul').addEventListener('input', function () { D.judul = this.value; markDirty(); renderPaper(); });
    $('#fCatatan').addEventListener('input', function () { D.catatan = this.value; markDirty(); renderPaper(); });
    $('#fKlien').addEventListener('change', function () {
      var v = this.value;
      if (v === '__manual') { D.klienKode = ''; $('#fKlienManual').style.display = ''; D.klienNama = $('#fKlienManual').value; }
      else { $('#fKlienManual').style.display = 'none'; var k = klien.filter(function (x) { return x.kodeKlien === v; })[0]; D.klienKode = k ? k.kodeKlien : ''; D.klienNama = k ? k.namaKlien : ''; }
      fillProyek(); markDirty(); renderPaper();
    });
    $('#fKlienManual').addEventListener('input', function () { D.klienNama = this.value; markDirty(); renderPaper(); });
    $('#fProyekPick').addEventListener('change', function () {
      var p = proyek.filter(function (x) { return String(x.idProyek) === $('#fProyekPick').value; })[0];
      if (!p) { D.proyekKode = ''; D.proyekNama = ''; D.proyekText = ''; }
      else {
        D.proyekKode = p.kodeProyek || ''; D.proyekNama = p.namaProyek; D.proyekText = MP.projectLabel(p);
        if (!D.judul) { D.judul = p.namaProyek; $('#fJudul').value = D.judul; }
        if (!D.klienKode && p.klienKode) { var k = klien.filter(function (x) { return x.kodeKlien === p.klienKode; })[0]; if (k) { D.klienKode = k.kodeKlien; D.klienNama = k.namaKlien; $('#fKlien').value = k.kodeKlien; } }
      }
      markDirty(); renderPaper();
    });
    [['tPt', 'pt'], ['tTtd', 'ttd'], ['tStempel', 'stempel'], ['tKlien', 'klienTtd']].forEach(function (x) {
      $('#' + x[0]).addEventListener('change', function () { D.show[x[1]] = this.checked; markDirty(); renderPaper(); });
    });
    $('#addItem').addEventListener('click', function () { D.items.push(newItem()); renderLists(); markDirty(); renderPaper(); var l = MP.$$('#itemsBox .md-item').pop(); if (l) $('[data-f=nama]', l).focus(); });
    $('#addExtra').addEventListener('click', function () { D.extra.push(newExtra()); renderLists(); markDirty(); renderPaper(); var l = MP.$$('#extraBox .md-item').pop(); if (l) $('[data-f=nama]', l).focus(); });
    ['itemsBox', 'extraBox'].forEach(function (id) {
      var box = $('#' + id);
      box.addEventListener('input', function (e) {
        var c = e.target.closest('.md-item'); if (!c) return;
        var it = D[c.dataset.g][Number(c.dataset.i)], f = e.target.dataset.f; if (!it || !f) return;
        it[f] = f === 'harga' ? MP.moneyVal(e.target) : e.target.value;
        $('[data-sum]', c).textContent = MP.rupiah(line(it)); markDirty(); renderPaper();
      });
      box.addEventListener('change', function (e) {
        var c = e.target.closest('.md-item'); if (!c || e.target.dataset.f !== 'satuan') return;
        D[c.dataset.g][Number(c.dataset.i)].satuan = e.target.value; markDirty(); renderPaper();
      });
      box.addEventListener('click', function (e) {
        var c = e.target.closest('.md-item'); if (!c || !e.target.closest('[data-rm]')) return;
        D[c.dataset.g].splice(Number(c.dataset.i), 1); if (c.dataset.g === 'items' && !D.items.length) D.items.push(newItem());
        renderLists(); markDirty(); renderPaper();
      });
    });
  }

  /* ---------- aksi ---------- */
  $('#btnSign').addEventListener('click', function () {
    var m = MP.modal({
      title: 'Tanda tangan', hideFooter: true,
      body: '<div class="mp-seg" style="grid-template-columns:1fr"><button type="button" id="sgCo">' + MP.icon('edit') + ' Tanda tangan perusahaan</button><button type="button" id="sgKl">' + MP.icon('edit') + ' Tanda tangan klien (persetujuan)</button></div>',
    });
    m.el.querySelector('#sgCo').addEventListener('click', async function () {
      m.close();
      var r = await MPD.signPad({ title: 'Tanda tangan penandatangan', key: 'company', current: D.sig });
      if (r === null) return;
      D.sig = r; if (r) { D.show.ttd = true; $('#tTtd').checked = true; } markDirty(); renderPaper();
    });
    m.el.querySelector('#sgKl').addEventListener('click', async function () {
      m.close();
      var r = await MPD.signPad({ title: 'Tanda tangan klien', key: 'rabklien', current: D.sigKlien });
      if (r === null) return;
      D.sigKlien = r; if (r) { D.show.klienTtd = true; $('#tKlien').checked = true; } markDirty(); renderPaper();
    });
  });
  $('#btnPrint').addEventListener('click', function () { MPD.printDoc(D.nomor || $('#fNomor').value); });
  $('#btnInv').addEventListener('click', function () {
    var items = D.items.filter(function (i) { return i.nama.trim() && MP.num(i.harga) > 0; }).concat(D.extra.filter(function (i) { return i.nama.trim() && MP.num(i.harga) > 0; }));
    if (!items.length) { MP.toast('Isi minimal satu item dengan harga', 'err'); return; }
    try {
      localStorage.setItem('mp_rab_handoff', JSON.stringify({
        klienKode: D.klienKode, klienNama: D.klienNama, proyekKode: D.proyekKode, proyekNama: D.proyekNama,
        proyekText: D.proyekText || D.judul, rabNomor: D.nomor,
        items: items.map(function (i) { return { nama: i.nama, ket: i.ket, qty: dec(i.qty) || 1, satuan: i.satuan, harga: MP.num(i.harga) }; })
      }));
    } catch (e) { MP.toast('Browser memblokir penyimpanan lokal', 'err'); return; }
    location.href = 'invoice.html?from=rab';
  });

  async function save() {
    if (!D.klienNama.trim()) { MP.toast('Pilih atau isi nama klien dulu', 'err'); return; }
    var valid = D.items.concat(D.extra).filter(function (i) { return i.nama.trim() && MP.num(i.harga) > 0; });
    if (!valid.length) { MP.toast('Isi minimal satu item dengan harga', 'err'); return; }
    var btn = $('#btnSave'); btn.disabled = true;
    var nomor = D.nomor || MPD.nextNumber(S.prefixRab || 'RAB', 'rab', docs, D.tanggal);
    async function attempt(no) {
      var data = JSON.parse(JSON.stringify(D)); data.nomor = no;
      return MP.post('saveDokumen', {
        tipe: 'rab', idDokumen: D.idDokumen || undefined, nomor: no, tanggal: D.tanggal, klienKode: D.klienKode, klienNama: D.klienNama,
        proyekKode: D.proyekKode, proyekNama: D.proyekNama || D.judul, total: total(), status: 'tersimpan', dataJson: JSON.stringify(data)
      });
    }
    var r = await attempt(nomor);
    if (!r.success && /sudah dipakai/i.test(r.message || '') && !D.idDokumen) {
      var g = await MP.get('getDokumen'); if (g.success) docs = g.data || [];
      nomor = MPD.nextNumber(S.prefixRab || 'RAB', 'rab', docs, D.tanggal); r = await attempt(nomor);
    }
    btn.disabled = false;
    if (!r.success) { MP.toast(r.message || 'Gagal menyimpan', 'err'); return; }
    D.idDokumen = r.id || D.idDokumen; D.nomor = nomor; saved = true; dirty = false;
    $('#fNomor').value = nomor; $('#nomorHint').textContent = 'Nomor tetap.';
    try { history.replaceState(null, '', 'rab.html?id=' + encodeURIComponent(D.idDokumen)); } catch (e) {}
    setChip(); renderPaper(); MP.toast('RAB ' + nomor + ' tersimpan', 'ok');
    MP.get('getDokumen').then(function (g) { if (g.success) docs = g.data || []; });
  }
  $('#btnSave').addEventListener('click', save);
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); } });

  var c = await MPD.loadCommon();
  S = c.settings; klien = c.klien; proyek = c.proyek; docs = c.dok;
  if (c._error) MP.toast(c._error, 'err');

  var idQ = MPD.qs('id'), dupQ = MPD.qs('dup');
  var src = idQ || dupQ ? docs.filter(function (d) { return String(d.idDokumen) === String(idQ || dupQ); })[0] : null;
  if (src) {
    var data = MPD.parseData(src);
    D = Object.assign(D, data);
    D.show = Object.assign({ pt: false, ttd: true, stempel: false, klienTtd: true }, data.show || {});
    if (!D.items || !D.items.length) D.items = [newItem()]; if (!D.extra) D.extra = [];
    if (idQ) { D.idDokumen = src.idDokumen; D.nomor = src.nomor; saved = true; }
    else { D.idDokumen = ''; D.nomor = ''; D.tanggal = MP.today(); D.sigKlien = ''; dirty = true; }
  } else {
    var kq = MPD.qs('klien'), pq = MPD.qs('proyek');
    if (pq) { var p = proyek.filter(function (x) { return String(x.idProyek) === pq; })[0]; if (p) { D.proyekKode = p.kodeProyek || ''; D.proyekNama = p.namaProyek; D.proyekText = MP.projectLabel(p); D.judul = p.namaProyek; kq = kq || p.klienKode; } }
    if (kq) { var k = klien.filter(function (x) { return String(x.kodeKlien).toUpperCase() === String(kq).toUpperCase(); })[0]; if (k) { D.klienKode = k.kodeKlien; D.klienNama = k.namaKlien; } }
  }
  buildForm(); renderPaper(); setChip();
  zoom = MPD.zoomCtl($('#stage'), $('#sizer'), $('#docPaper'), $('#zLbl'), $('#zMin'), $('#zPlus'));
  renderPaper();
});
</script>
